[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-color-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented hex-code claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
hex-color-validation-claim-audit = "hex_color_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["hex_color_validation_claim_audit*"]
